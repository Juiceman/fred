name: Astyle Code Formatter

on:
  pull_request:
    branches:
      - next  # Change the pull request branch name to 'next'

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4.1.1
        with:
          ref: next

      - name: Install Astyle
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle

      - name: Get commit hashes
        id: commit_hashes
        run: |
          before=$(git rev-parse origin/next)
          after=$(git rev-parse HEAD)
          echo "::set-output name=before::$before"
          echo "::set-output name=after::$after"
          echo "Before: $before"
          echo "After: $after"

      - name: Get modified files
        id: get_files
        run: |
          echo "::set-output name=files::$(git diff --name-only ${{ steps.commit_hashes.outputs.before }} ${{ steps.commit_hashes.outputs.after }})"
          echo "Modified files:"
          cat ${{ steps.get_files.outputs.files }}

      - name: Format modified files
        run: |
          IFS=$'\n' read -r -d '' -a files <<< "${{ steps.get_files.outputs.files }}"
          for file in "${files[@]}"; do
            astyle --indent=force-tab=4 --suffix=none "$file"
          done

      - name: Create commit
        uses: stefanzweifel/git-auto-commit-action@v5.0.0
        with:
          commit_message: "Format code using Astyle"
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
