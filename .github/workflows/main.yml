name: Astyle Code Formatter

on:
  pull_request:
    branches:
      - next  # Update with your main branch name or the branch you want to target

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install Astyle
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle

      - name: Format code
        run: |
          astyle --recursive --options=.astylerc .

      - name: Create Notification
        uses: actions/github-script@5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueComment = `Hello! Astyle code formatter has formatted the code in this pull request. Please review the changes.`;
            await github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: issueComment
            });
